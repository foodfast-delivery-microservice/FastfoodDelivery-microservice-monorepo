# --- Application ---
spring.application.name=notification-service
server.port=8086
# --- Eureka ---
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
# --- RabbitMQ ---
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.concurrency=5
spring.rabbitmq.listener.simple.max-concurrency=10
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=1000
spring.rabbitmq.template.retry.max-attempts=3
spring.rabbitmq.template.retry.multiplier=2
# --- Mail (Gmail SMTP) - Thay username/password theo QUICK_START.md hoặc GMAIL_SETUP_GUIDE.md ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:nguyenxuantiendat200316@gmail.com}
spring.mail.password=${MAIL_PASSWORD:qneq bsxm vjzg fvlb}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${spring.mail.username:noreply@fastfooddelivery.com}
# --- Thymeleaf (email templates) ---
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/email/
spring.thymeleaf.suffix=.html
# --- Database ---
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/notificationservice}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
# --- Email Retry Configuration ---
notification.email.retry.max-retries=${EMAIL_MAX_RETRIES:3}
notification.email.retry.base-delay-seconds=${EMAIL_BASE_DELAY:60}
# --- Email Template Subjects ---
email.templates.subjects.payment-success=Thanh toán thành công - Đơn hàng #{orderId}
email.templates.subjects.payment-failure=Thanh toán thất bại - Đơn hàng #{orderId}
email.templates.subjects.payment-refunded=Hoàn tiền thành công - Đơn hàng #{orderId}
email.templates.subjects.order-confirmed=Đơn hàng đã được xác nhận - #{orderCode}
email.templates.subjects.user-registered=Welcome to FastFood Delivery!
email.templates.subjects.generic=Notification from FastFood Delivery
# --- Rate Limiting Configuration ---
notification.email.rate-limit.enabled=${EMAIL_RATE_LIMIT_ENABLED:true}
notification.email.rate-limit.max-emails-per-minute=${EMAIL_RATE_LIMIT_PER_MINUTE:10}
# --- Resilience4j Rate Limiter Configuration ---
resilience4j.ratelimiter.instances.emailRateLimiter.limitForPeriod=10
resilience4j.ratelimiter.instances.emailRateLimiter.limitRefreshPeriod=60s
resilience4j.ratelimiter.instances.emailRateLimiter.timeoutDuration=5s
# --- Circuit Breaker Configuration ---
resilience4j.circuitbreaker.instances.userService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.userService.sliding-window-size=10
resilience4j.circuitbreaker.instances.userService.minimum-number-of-calls=5
# --- Actuator ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true
spring.jmx.enabled=false
# --- Logging ---
logging.level.com.example.notificationservice=INFO
logging.level.org.springframework.amqp=WARN
