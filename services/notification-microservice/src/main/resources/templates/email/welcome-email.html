<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome to FastFood Delivery</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
<div style="max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 5px;">
    <h1 style="color: #e67e22;">Welcome, <span th:text="${name}">User</span>! 🍔</h1>
    <p>Thank you for registering with <strong>FastFood Delivery</strong>.</p>
    <p>We are excited to have you on board. You can now browse our menu and order your favorite meals.</p>

    <div style="text-align: center; margin: 30px 0;">
        <a th:href="${loginUrl}"
           style="background-color: #e67e22; color: white; padding: 12px 25px; text-decoration: none; border-radius: 25px; font-weight: bold;">Order
            Now</a>
    </div>

    <p>If you have any questions, feel free to reply to this email.</p>
    <hr style="border: none; border-top: 1px solid #eee; margin: 20px 0;">
    <p style="font-size: 12px; color: #777;">Best regards,<br>The FastFood Delivery Team</p>
</div>
</body>
</html>
