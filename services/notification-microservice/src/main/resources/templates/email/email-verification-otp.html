<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Email Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f6f7fb;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 24px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
        }

        .title {
            font-size: 20px;
            margin: 0 0 12px;
        }

        .muted {
            color: #5b6170;
            font-size: 14px;
            margin: 0 0 16px;
        }

        .otp {
            font-size: 32px;
            letter-spacing: 6px;
            font-weight: 700;
            text-align: center;
            padding: 14px 12px;
            border: 1px dashed #c7cbe0;
            border-radius: 10px;
            background: #fafbff;
        }

        .hint {
            margin-top: 16px;
            color: #5b6170;
            font-size: 13px;
        }

        .footer {
            margin-top: 18px;
            color: #8b90a0;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1 class="title">Verify your email</h1>
        <p class="muted">Use the verification code below to confirm your email address.</p>

        <div class="otp" th:text="${otpCode}">123456</div>

        <p class="hint">
            This code expires in
            <span th:text="${expiresMinutes}">10</span>
            minutes.
        </p>

        <p class="footer">If you did not request this, you can ignore this email.</p>
    </div>
</div>
</body>
</html>
