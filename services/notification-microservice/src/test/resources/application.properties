spring.application.name=notification-service
server.port=0

# Test database configuration (H2 memory database)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable Flyway for tests
spring.flyway.enabled=false

# Disable Eureka for tests
eureka.client.enabled=false

# JWT config for tests
app.security.enabled=false
app.jwt.base64-secretkey=dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLXB1cnBvc2VzLW9ubHk=

# Mail config for tests
spring.mail.host=localhost
spring.mail.username=dummy-mail@example.com
spring.mail.password=dummy-mail-password

# RabbitMQ config for tests
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.auto-startup=false

# SendGrid Webhook config for tests
sendgrid.webhook.verification-key=test-key-123
sendgrid.webhook.signature-validation.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.example.notificationservice=INFO
