# Management
management.endpoints.web.exposure.include=health,info
management.tracing.enabled=false

# --- JMX Configuration ---
# Disable JMX to avoid "Failed to retrieve application JMX service URL" warning
spring.jmx.enabled=false
management.endpoints.jmx.exposure.exclude=*

# JWT Token Expiration
app.jwt.refresh.expiration-in-seconds=2592000
app.jwt.access.expiration-in-seconds=1800

# Logging
logging.level.org.springframework.cloud.gateway=WARN