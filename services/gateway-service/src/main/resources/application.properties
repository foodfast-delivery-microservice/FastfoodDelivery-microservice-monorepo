server.port=8080
spring.application.name=gateway-service

# --- Eureka Client ---
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=10

# --- JWT Secret Key ---
app.jwt.base64-secretkey=${APP_JWT_SECRETKEY}

# ---- Gateway Routes
# Upload and files routes must come BEFORE products route to match correctly
spring.cloud.gateway.server.webmvc.routes[0].id=upload
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://product-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0].name=Path
spring.cloud.gateway.server.webmvc.routes[0].predicates[0].args.pattern=/api/v1/upload/**

spring.cloud.gateway.server.webmvc.routes[1].id=files
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://product-service
