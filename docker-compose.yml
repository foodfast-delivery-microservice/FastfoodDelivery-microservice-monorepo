services:
  # 1. Service Registry (Eureka)
  registry-service:
    build: ./services/registry-service
    container_name: registry-service
    ports:
      - "8761:8761"

  # 2. Database (MySQL)
  mysql-db:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: userservice
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  # 3. Message Broker (RabbitMQ)
  rabbitmq-broker:
    image: rabbitmq:3.13-management
    container_name: rabbitmq-broker
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}

  # 4. API Gateway
  gateway-service:
    build: ./services/gateway-service
    container_name: gateway-service
    ports:
      - "8089:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry-service:8761/eureka/
      APP_JWT_SECRETKEY: ${APP_JWT_SECRETKEY}
    depends_on:
      registry-service:
        condition: service_started

  # 5. User Service
  user-service:
    build: ./services/user-microservice
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/userservice
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry-service:8761/eureka/
      SPRING_RABBITMQ_HOST: rabbitmq-broker
      APP_JWT_SECRETKEY: ${APP_JWT_SECRETKEY}
      APP_ADMIN_SECRET: ${APP_ADMIN_SECRET}
    depends_on:
      registry-service:
        condition: service_started
      mysql-db:
        condition: service_healthy
      rabbitmq-broker:
        condition: service_started

  # 6. Product Service
  product-service:
    build: ./services/product-microservice
    container_name: product-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/productmicroservice
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry-service:8761/eureka/
      APP_JWT_SECRETKEY: ${APP_JWT_SECRETKEY}
      SPRING_RABBITMQ_HOST: rabbitmq-broker
    depends_on:
      registry-service:
        condition: service_started
      mysql-db:
        condition: service_healthy
      rabbitmq-broker:
        condition: service_started

  # 7. Order Service
  order-service:
    build: ./services/order-microservice
    container_name: order-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/orderservice
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry-service:8761/eureka/
      SPRING_RABBITMQ_HOST: rabbitmq-broker
    depends_on:
      registry-service:
        condition: service_started
      mysql-db:
        condition: service_healthy
      rabbitmq-broker:
        condition: service_started

  # 8. Payment service
  payment-service:
    build: ./services/payment-microservice
    container_name: payment-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/paymentservice
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry-service:8761/eureka/
      SPRING_RABBITMQ_HOST: rabbitmq-broker
    depends_on:
      registry-service:
        condition: service_started
      mysql-db:
        condition: service_healthy
      rabbitmq-broker:
        condition: service_started

  drone-service:
    build: ./services/drone-microservice
    container_name: drone-service
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/droneservice
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry-service:8761/eureka/
      SPRING_RABBITMQ_HOST: rabbitmq-broker
    depends_on:
      registry-service:
        condition: service_started
      mysql-db:
        condition: service_healthy
      rabbitmq-broker:
        condition: service_started

  # 10. Notification Service
  notification-service:
    build: ./services/notification-microservice
    container_name: notification-service
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/notificationservice
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry-service:8761/eureka/
      SPRING_RABBITMQ_HOST: rabbitmq-broker
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      DATABASE_URL: jdbc:mysql://mysql-db:3306/notificationservice
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: 1234
      APP_JWT_SECRETKEY: ${APP_JWT_SECRETKEY}
    depends_on:
      registry-service:
        condition: service_started
      mysql-db:
        condition: service_healthy
      rabbitmq-broker:
        condition: service_started
      mysql-db:
        condition: service_healthy

  # 9. Frontend Application
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway-service
    networks:
      - default

volumes:
  mysql-data:


networks:
  default:
    name: microservice-net
